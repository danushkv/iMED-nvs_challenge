<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">GeoSCOPE architecture</title>
  <desc id="desc">Endoscope2 RGB-D feeds a surface geometry renderer and a learned Endo-4DGS renderer. A geometric support mask preserves valid geometry exactly and selects the learned renderer only for unsupported pixels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081522"/>
      <stop offset="0.55" stop-color="#102c3b"/>
      <stop offset="1" stop-color="#17213d"/>
    </linearGradient>
    <linearGradient id="geo" x1="0" x2="1">
      <stop offset="0" stop-color="#23c7a4"/>
      <stop offset="1" stop-color="#39a6d8"/>
    </linearGradient>
    <linearGradient id="learned" x1="0" x2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#d068d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a9c4d5"/>
    </marker>
    <style>
      .title { font-family: "DejaVu Sans"; font-size: 52px; font-weight: 800; fill: #fff; }
      .tag { font-family: "DejaVu Sans"; font-size: 19px; fill: #bcd2df; }
      .head { font-family: "DejaVu Sans"; font-size: 20px; font-weight: 700; fill: #fff; }
      .branch-head { font-family: "DejaVu Sans"; font-size: 18px; font-weight: 700; fill: #fff; }
      .body { font-family: "DejaVu Sans"; font-size: 15px; fill: #d9e8ef; }
      .tiny { font-family: "DejaVu Sans"; font-size: 13px; fill: #a9c4d5; }
      .choice { font-family: "DejaVu Sans"; font-size: 17px; font-weight: 700; fill: #fff; }
      .arrow { fill: none; stroke: #a9c4d5; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#background)"/>
  <circle cx="1070" cy="80" r="170" fill="#3c72a7" opacity="0.10"/>
  <circle cx="105" cy="445" r="180" fill="#21c29e" opacity="0.08"/>
  <text x="55" y="75" class="title">GeoSCOPE</text>
  <text x="58" y="107" class="tag">Geometry-first Selective Completion Of Projection Errors</text>

  <g filter="url(#shadow)">
    <rect x="55" y="170" width="210" height="150" rx="18" fill="#132e40" stroke="#5f8298"/>
    <rect x="345" y="145" width="275" height="120" rx="18" fill="url(#geo)"/>
    <rect x="345" y="305" width="275" height="120" rx="18" fill="url(#learned)"/>
    <rect x="690" y="170" width="250" height="230" rx="20" fill="#172f45" stroke="#78cbb7" stroke-width="2"/>
    <rect x="990" y="205" width="155" height="160" rx="22" fill="#f7fbfd"/>
  </g>

  <text x="80" y="210" class="head">Endoscope2</text>
  <text x="80" y="242" class="body">RGB + metric depth</text>
  <text x="80" y="268" class="body">intrinsics + poses</text>
  <text x="80" y="294" class="body">source tool mask</text>

  <text x="482.5" y="184" class="branch-head" text-anchor="middle">M3-B · geometry first</text>
  <text x="482.5" y="214" class="body" text-anchor="middle">Surface-aware RGB-D splatting</text>
  <text x="482.5" y="239" class="body" text-anchor="middle">+ bounded radius-3 fill</text>

  <text x="482.5" y="344" class="branch-head" text-anchor="middle">M2 · learned completion</text>
  <text x="482.5" y="374" class="body" text-anchor="middle">Metric-depth Endo-4DGS</text>
  <text x="482.5" y="399" class="body" text-anchor="middle">trained per source sequence</text>

  <text x="815" y="210" class="head" text-anchor="middle">Selective completion</text>
  <text x="815" y="250" class="body" text-anchor="middle">M3-B supported?</text>
  <rect x="720" y="270" width="190" height="38" rx="19" fill="#23c7a4" opacity="0.9"/>
  <text x="815" y="295" class="choice" text-anchor="middle">YES · preserve</text>
  <rect x="720" y="320" width="190" height="38" rx="19" fill="#a871e8" opacity="0.9"/>
  <text x="815" y="345" class="choice" text-anchor="middle">NO · complete</text>
  <text x="815" y="375" class="tiny" text-anchor="middle">Invariant: supported M3-B pixels</text>
  <text x="815" y="392" class="tiny" text-anchor="middle">remain byte-identical</text>

  <text x="1016" y="248" font-family="DejaVu Sans" font-size="46" font-weight="800" fill="#102c3b">RGB</text>
  <text x="1012" y="286" font-family="DejaVu Sans" font-size="16" fill="#40576a">Endoscope1</text>
  <text x="1017" y="312" font-family="DejaVu Sans" font-size="16" fill="#40576a">novel view</text>
  <path d="M1014 334 H1120" stroke="#23a98e" stroke-width="6" stroke-linecap="round"/>

  <path d="M265 225 C300 225 306 205 341 205" class="arrow"/>
  <path d="M265 270 C302 270 304 365 341 365" class="arrow"/>
  <path d="M620 205 H686" class="arrow"/>
  <path d="M620 365 H686" class="arrow"/>
  <path d="M940 285 H986" class="arrow"/>

  <text x="55" y="467" class="tiny">Source-only inference · calibrated geometry where available · learned prediction only where geometry is unsupported</text>
</svg>
