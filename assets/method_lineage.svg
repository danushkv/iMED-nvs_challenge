<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">iMED NVS method lineage</title>
  <desc id="desc">Two experiment branches: RGB-D geometry from Method 1 through Method 3, Endo-4DGS metric depth as Method 2, and independent G-SHARP Method 4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526273"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, sans-serif; fill: #172033; }
      .label { font: 700 16px system-ui, sans-serif; fill: #172033; }
      .small { font: 13px system-ui, sans-serif; fill: #4a596b; }
      .branch { font: 700 13px system-ui, sans-serif; fill: #36506f; letter-spacing: .8px; }
      .edge { stroke: #526273; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <text x="42" y="42" class="title">From direct geometry to dynamic surgical Gaussians</text>
  <text x="42" y="75" class="branch">TRAINING-FREE GEOMETRY</text>
  <g filter="url(#shadow)">
    <rect x="42" y="94" width="205" height="82" rx="12" fill="#ffffff" stroke="#87a7cc"/>
    <rect x="286" y="94" width="205" height="82" rx="12" fill="#ffffff" stroke="#5586c0"/>
    <rect x="530" y="94" width="205" height="82" rx="12" fill="#ffffff" stroke="#3a70ae"/>
    <rect x="774" y="94" width="185" height="82" rx="12" fill="#ffffff" stroke="#3a70ae"/>
  </g>
  <text x="62" y="125" class="label">M1 · RGB-D</text>
  <text x="62" y="149" class="small">Direct reprojection</text>
  <text x="306" y="125" class="label">MV1A</text>
  <text x="306" y="149" class="small">Soft splats + fill</text>
  <text x="550" y="125" class="label">M3-B</text>
  <text x="550" y="149" class="small">Surface footprint</text>
  <text x="794" y="125" class="label">M3-C</text>
  <text x="794" y="149" class="small">Confidence gate</text>
  <path d="M247 135 H282" class="edge"/>
  <path d="M491 135 H526" class="edge"/>
  <path d="M735 135 H770" class="edge"/>

  <text x="42" y="229" class="branch">PER-SEQUENCE OPTIMIZATION</text>
  <g filter="url(#shadow)">
    <rect x="42" y="248" width="265" height="82" rx="12" fill="#fffaf1" stroke="#d19a3c"/>
    <rect x="397" y="248" width="265" height="82" rx="12" fill="#f2fbf7" stroke="#3e9b72"/>
    <rect x="752" y="248" width="265" height="82" rx="12" fill="#fff4f4" stroke="#c86a6a"/>
  </g>
  <text x="62" y="279" class="label">M2 · Metric depth</text>
  <text x="62" y="303" class="small">Endo-4DGS overlay · keep</text>
  <text x="417" y="279" class="label">M4-A · G-SHARP</text>
  <text x="417" y="303" class="small">50k depth init · keep</text>
  <text x="772" y="279" class="label">M4-B · Surface init</text>
  <text x="772" y="303" class="small">Controlled ablation · drop</text>
  <path d="M662 289 H748" class="edge"/>
  <path d="M628 176 C628 208 840 209 840 244" class="edge dashed"/>
  <text x="692" y="214" class="small">source-geometry idea only</text>
</svg>
