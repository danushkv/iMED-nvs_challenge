<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">iMED NVS method lineage culminating in GeoSCOPE</title>
  <desc id="desc">Training-free geometry evolves from M1 to MV1A and M3-B, metric-depth Endo-4DGS forms M2, and the two retained branches join in GeoSCOPE. G-SHARP is shown as an independent ablation branch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f6f9fc"/><stop offset="1" stop-color="#edf5f7"/></linearGradient>
    <linearGradient id="final" x1="0" x2="1"><stop offset="0" stop-color="#1fbf9c"/><stop offset="1" stop-color="#367fd0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#526273"/></marker>
    <style>
      .title { font: 750 22px system-ui, sans-serif; fill: #172033; }
      .label { font: 700 16px system-ui, sans-serif; fill: #172033; }
      .white { font: 750 20px system-ui, sans-serif; fill: #fff; }
      .small { font: 13px system-ui, sans-serif; fill: #4a596b; }
      .smallw { font: 13px system-ui, sans-serif; fill: #e9f8f5; }
      .branch { font: 700 13px system-ui, sans-serif; fill: #36506f; letter-spacing: .8px; }
      .edge { stroke: #526273; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1200" height="460" rx="18" fill="url(#bg)"/>
  <text x="38" y="42" class="title">Experiment lineage: what survived into the final submission?</text>
  <text x="38" y="76" class="branch">TRAINING-FREE GEOMETRY</text>
  <g filter="url(#shadow)">
    <rect x="38" y="94" width="160" height="78" rx="12" fill="#fff" stroke="#87a7cc"/>
    <rect x="235" y="94" width="160" height="78" rx="12" fill="#fff" stroke="#5586c0"/>
    <rect x="432" y="94" width="160" height="78" rx="12" fill="#fff" stroke="#27a98e" stroke-width="2"/>
    <rect x="629" y="94" width="160" height="78" rx="12" fill="#fff" stroke="#7c91aa"/>
  </g>
  <text x="58" y="124" class="label">M1 · RGB-D</text><text x="58" y="149" class="small">Direct projection</text>
  <text x="255" y="124" class="label">MV1A</text><text x="255" y="149" class="small">Soft splats + fill</text>
  <text x="452" y="124" class="label">M3-B</text><text x="452" y="149" class="small">Surface splats · keep</text>
  <text x="649" y="124" class="label">M3-C</text><text x="649" y="149" class="small">Confidence ablation</text>
  <path d="M198 133 H231" class="edge"/><path d="M395 133 H428" class="edge"/><path d="M592 133 H625" class="edge"/>

  <text x="38" y="245" class="branch">LEARNED DYNAMIC RENDERING</text>
  <g filter="url(#shadow)">
    <rect x="38" y="264" width="235" height="82" rx="12" fill="#fffaf1" stroke="#d19a3c"/>
    <rect x="330" y="264" width="235" height="82" rx="12" fill="#f2fbf7" stroke="#3e9b72"/>
    <rect x="622" y="264" width="235" height="82" rx="12" fill="#fff4f4" stroke="#c86a6a"/>
  </g>
  <text x="58" y="295" class="label">M2 · Metric depth</text><text x="58" y="320" class="small">Endo-4DGS · keep as fallback</text>
  <text x="350" y="295" class="label">M4-A · G-SHARP</text><text x="350" y="320" class="small">Independent ablation</text>
  <text x="642" y="295" class="label">M4-B · Surface init</text><text x="642" y="320" class="small">Controlled ablation</text>
  <path d="M565 305 H618" class="edge"/>

  <g filter="url(#shadow)"><rect x="925" y="125" width="235" height="190" rx="20" fill="url(#final)"/></g>
  <text x="955" y="170" class="white">GeoSCOPE</text>
  <text x="955" y="202" class="smallw">M3-B where supported</text>
  <text x="955" y="227" class="smallw">M2 only in holes</text>
  <rect x="955" y="252" width="172" height="36" rx="18" fill="#fff" opacity="0.2"/>
  <text x="974" y="276" class="smallw">FINAL SUBMISSION</text>
  <path d="M592 145 C800 145 825 165 921 190" class="edge"/>
  <path d="M273 305 C700 405 840 310 921 255" class="edge"/>
  <path d="M512 172 C512 220 447 220 447 260" class="edge dash"/>
  <text x="475" y="215" class="small">surface idea</text>
  <text x="38" y="420" class="small">Kept and rejected branches remain documented so new work can start from the appropriate controlled experiment.</text>
</svg>
